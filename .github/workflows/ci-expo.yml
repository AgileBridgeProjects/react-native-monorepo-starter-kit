name: CI — Expo

on:
  push:
    branches: [main, dev, uat]
  pull_request:
    branches: [main, dev, uat]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# A push to a shared branch is a required check on that exact commit, so successive
# merges must not cancel each other: the sha keeps each push in its own group. PR
# refs are already per-PR, where superseding an older commit is what we want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      expo: ${{ steps.filter.outputs.expo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            expo:
              - apps/expo/**
              - packages/shared/**
              # patch-package patches are native surface (mobile-version.mjs NATIVE_SURFACE),
              # so a patches-only PR must reach the version check rather than skipping it.
              - patches/**
              - package.json
              - package-lock.json
              - tsconfig.base.json
              - biome.json

  checks:
    name: Checks (expo)
    needs: changes
    if: needs.changes.outputs.expo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — mobile-version.mjs needs the merge base and the mobile-v* release tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/expo
      - run: npm run typecheck -w apps/expo
      - run: npm run test -w apps/expo
      - name: Regenerate proxy from committed schema
        run: npm run generate:proxy:local -w apps/expo
      - name: Fail if proxy code is out of date
        run: |
          if git diff --exit-code apps/expo/src/proxy/; then
            echo "✅ Proxy code matches committed OpenAPI schema."
          else
            echo "❌ Proxy drift detected! The committed proxy code does not match the OpenAPI schema."
            echo "Run 'npm run generate:proxy:local -w apps/expo' and commit the result."
            exit 1
          fi
      - run: node scripts/check-native-imports.mjs
        working-directory: apps/expo
      # Mobile versions: apps/expo/version.json must carry the production bump the PR's
      # Conventional Commits owe and a runtime bump for any native-surface change. The
      # same check runs in .husky/pre-push; this is the server-side backstop. "[js-only]"
      # in the PR title waives the runtime half only.
      # See docs/standards/ota-updates.md § Versioning.
      - name: Check mobile versions
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          JS_ONLY: ${{ contains(github.event.pull_request.title, '[js-only]') }}
        run: node scripts/mobile-version.mjs check --base "origin/$BASE_REF"
        working-directory: apps/expo

  build:
    name: Build (expo)
    needs: [changes, checks]
    if: needs.changes.outputs.expo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform ios && npx expo export --platform android
        working-directory: apps/expo

  # Single required status check for this workflow. Always runs (even when the
  # area is unchanged and the jobs above skip) so a required check is always
  # reported — avoids the path-filter deadlock where a skipped required check
  # blocks the PR forever. Passes when the jobs succeeded or were skipped;
  # fails only if a job actually failed or was cancelled.
  gate:
    name: Expo CI
    needs: [changes, checks, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required Expo jobs passed (or were skipped)
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES checks=$CHECKS build=$BUILD"
          for r in "$CHANGES" "$CHECKS" "$BUILD"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "A required Expo job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "Expo CI gate passed."
