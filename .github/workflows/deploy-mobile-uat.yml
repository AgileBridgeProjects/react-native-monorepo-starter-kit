name: Deploy Mobile (uat)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and submit
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android

permissions:
  contents: read
  id-token: write # required for OIDC Azure login

# Shared with the other mobile store pipelines on purpose: they all publish from one
# EAS project, and letting them overlap is what makes a submit take the wrong artifact.
concurrency:
  group: deploy-mobile-stores
  cancel-in-progress: false

jobs:
  build-ios:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
    runs-on: ubuntu-latest
    environment: uat
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check for banned native imports
        run: node scripts/check-native-imports.mjs

      - name: Build iOS IPA (EAS cloud)
        run: eas build --platform ios --profile uat --non-interactive --clear-cache

  build-android:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    environment: uat
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check for banned native imports
        run: node scripts/check-native-imports.mjs

      - name: Build Android AAB (EAS cloud)
        run: eas build --platform android --profile uat --non-interactive --clear-cache

      - name: Post build link to job summary
        run: |
          echo "### Android build ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 [View latest build](https://expo.dev/accounts/YOUR-EXPO-ACCOUNT/projects/starterkit/builds?platform=android)" >> $GITHUB_STEP_SUMMARY

  submit-android:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' }}
    needs: build-android
    runs-on: ubuntu-latest
    environment: uat
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode Google Play service account key
        run: |
          mkdir -p keys
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > keys/google-play-service-account.json

      - name: Resolve the uat Android build to submit
        id: target
        run: |
          set -euo pipefail
          # NOT `--latest`: that flag picks the newest build for the PLATFORM across the
          # whole EAS project, ignoring the profile. When two of these pipelines run close
          # together it submits the wrong artifact — a uat IPA into another app record, an
          # APK into a Play listing that only accepts bundles. Selecting by profile is the
          # fix; the shared `deploy-mobile-stores` concurrency group is what keeps "newest
          # finished for this profile" unambiguous.
          build=$(eas build:list --platform android --buildProfile uat --status finished --limit 1 --non-interactive --json | jq -c '.[0] // empty')
          if [ -z "$build" ]; then
            echo "::error title=No uat Android build to submit::eas build:list found no finished android build for profile 'uat'."
            exit 1
          fi
          id=$(printf '%s' "$build" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "::error title=Unreadable build record::eas build:list returned a build with no id: $build"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Submitting build $id ($(printf '%s' "$build" | jq -r '"\(.appVersion) (\(.appBuildVersion))"'))"

      - name: Submit Android to Play Store (internal testing)
        run: eas submit --platform android --profile uat --non-interactive --id ${{ steps.target.outputs.id }}

      # The decoded Apple .p8 and Play service-account JSON are private keys sitting on the
      # runner's disk. Nothing else in the job needs them once the submit step is done.
      - name: Shred decoded credentials
        if: always()
        run: rm -rf keys apps/expo/keys
  submit-ios:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
    needs: build-ios
    runs-on: ubuntu-latest
    environment: uat
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode App Store Connect API key
        run: |
          mkdir -p keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 -d > keys/asc-api-key.p8

      - name: Resolve the uat iOS build to submit
        id: target
        run: |
          set -euo pipefail
          # NOT `--latest`: that flag picks the newest build for the PLATFORM across the
          # whole EAS project, ignoring the profile. When two of these pipelines run close
          # together it submits the wrong artifact — a uat IPA into another app record, an
          # APK into a Play listing that only accepts bundles. Selecting by profile is the
          # fix; the shared `deploy-mobile-stores` concurrency group is what keeps "newest
          # finished for this profile" unambiguous.
          build=$(eas build:list --platform ios --buildProfile uat --status finished --limit 1 --non-interactive --json | jq -c '.[0] // empty')
          if [ -z "$build" ]; then
            echo "::error title=No uat iOS build to submit::eas build:list found no finished ios build for profile 'uat'."
            exit 1
          fi
          id=$(printf '%s' "$build" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "::error title=Unreadable build record::eas build:list returned a build with no id: $build"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Submitting build $id ($(printf '%s' "$build" | jq -r '"\(.appVersion) (\(.appBuildVersion))"'))"

      - name: Submit iOS to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: eas submit --platform ios --profile uat --non-interactive --id ${{ steps.target.outputs.id }}

      # The decoded Apple .p8 and Play service-account JSON are private keys sitting on the
      # runner's disk. Nothing else in the job needs them once the submit step is done.
      - name: Shred decoded credentials
        if: always()
        run: rm -rf keys apps/expo/keys
