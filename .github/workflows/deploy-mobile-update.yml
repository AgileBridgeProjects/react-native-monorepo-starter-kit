name: Deploy Mobile (OTA update)

# Pushes an EAS Update (JS bundle only — no native rebuild) to a channel.
#
# Channel mapping:
#   push to dev            → dev        channel (TestFlight / internal testers)
#   dispatch, on main only → production channel (App Store / Play Store users)
#
# Production is dispatch-only, deliberately. This used to publish on every push
# to `main`, which is unsafe on two counts. App Store Review Guideline 2.5.2
# permits OTA JavaScript only while it does not materially change the app's
# features or purpose, and a push trigger cannot tell a copy tweak from a feature
# drop. And the path filter is broad enough that an unrelated file merged to main
# — a served static asset, a lockfile move — would ship to real users. Shipping to
# production is a release decision, so it needs a human and a typed confirmation.
# See docs/standards/ota-updates.md § Shipping an OTA to production.
#
# All publish logic lives in apps/expo/scripts/publish-ota.mjs — it syncs the
# eas.json profile env to the EAS environment, verifies the runtimeVersion
# matches the newest installed build per platform (skipping with a warning —
# a green run, not a red failure — when a full build is still pending, instead
# of publishing an update no device would receive), and then publishes.
# See docs/standards/ota-updates.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-to-production to confirm. Only runs on main.
        required: true
        type: string
  push:
    branches:
      - dev
    paths:
      - apps/expo/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - biome.json

permissions:
  contents: read

concurrency:
  group: deploy-mobile-update-${{ github.ref_name }}
  # A production publish is never cancelled mid-flight; a dev push may supersede itself.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  update:
    # Renders the target, so a mis-aimed dispatch is legible in the run list.
    name: EAS Update (${{ github.event_name == 'workflow_dispatch' && 'production' || 'dev' }} @ ${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'dev' }}
    defaults:
      run:
        working-directory: apps/expo
    steps:
      # Two locks on a production publish: the ref must be main, and the operator has
      # to type the phrase. The `production` GitHub environment should also carry a
      # deployment-branch policy of main only, which is the binding one.
      - name: Validate production dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error title=Wrong branch::A production OTA publishes from main. This run is on '$GITHUB_REF_NAME'."
            exit 1
          fi
          if [ "$CONFIRM" != "publish-to-production" ]; then
            echo "::error title=Not confirmed::Type publish-to-production in the confirm input to publish to real users."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-ota-relevant-changes.mjs diffs against the pre-push SHA —
          # needs real history, not the default shallow single-commit clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for OTA-relevant changes
        id: ota-relevant
        env:
          # Passed via env, not inlined into the script, per GitHub's
          # run-step injection guidance (matches the Publish step below).
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — the operator decided this is worth publishing."
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "First push on this ref (no prior SHA to diff against) — treating as relevant."
          else
            node scripts/check-ota-relevant-changes.mjs --before "$BEFORE" --after "$AFTER"
          fi

      - name: Install dependencies
        if: steps.ota-relevant.outputs.relevant == 'true'
        run: npm ci
        working-directory: .

      - name: Setup Expo and EAS CLI
        if: steps.ota-relevant.outputs.relevant == 'true'
        uses: expo/expo-github-action@v8
        with:
          # Pinned — an unpinned "latest" broke `eas update` for weeks when the
          # CLI removed the --profile flag. Bump deliberately.
          eas-version: 20.5.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check for banned native imports
        if: steps.ota-relevant.outputs.relevant == 'true'
        run: node scripts/check-native-imports.mjs

      - name: Publish EAS Update
        if: steps.ota-relevant.outputs.relevant == 'true'
        env:
          # head_commit is absent on a dispatch, so key the message on the event rather
          # than on the field being falsy.
          COMMIT_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && format('Manual production OTA dispatched by {0} ({1})', github.actor, github.sha) || github.event.head_commit.message }}
        run: |
          PROFILE="${{ github.event_name == 'workflow_dispatch' && 'production' || 'dev' }}"
          node scripts/publish-ota.mjs --profile "$PROFILE" --message "$COMMIT_MESSAGE"

      - name: No OTA-relevant changes
        if: steps.ota-relevant.outputs.relevant != 'true'
        run: echo "::notice title=OTA skipped::No Expo-relevant files changed in this push (root lockfile/package.json changes belonged to other workspaces) — nothing published."
