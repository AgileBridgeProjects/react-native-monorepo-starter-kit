  # ── Report Failures → Linear ────────────────────────────────
  # Only on dev-context runs (schedule / manual) — never on the dev→uat PR,
  # where failures are visible in the PR check itself.
  # ── Aggregators ─────────────────────────────────────────────────────────────
  # These own the names the branch ruleset marks required, and they merge the shards'
  # blob reports into the single html + json report the rest of the pipeline expects.
  # `if: always()` so a required check is always reported: a skipped required check
  # blocks a PR forever.

  playwright:
    name: Playwright (Web)
    needs: playwright-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'dev' }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: web-blob-*
          merge-multiple: true
          path: e2e/blob-report
        continue-on-error: true

      - name: Merge shard reports
        working-directory: e2e
        run: npx playwright merge-reports --reporter json,html ./blob-report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/web-results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: html-report
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/html-report/
            e2e/test-results/web-results.json
          retention-days: 14

      # The merge step must not be what decides the check. A shard that failed its tests
      # still uploads a blob, so the verdict comes from the shards themselves.
      - name: Report shard outcome
        env:
          SHARDS: ${{ needs.playwright-shard.result }}
        run: |
          echo "shards=$SHARDS"
          case "$SHARDS" in
            success|skipped) echo "Web suite passed (or was skipped)." ;;
            *) echo "::error title=Web E2E failed::A Playwright (Web) shard did not pass ($SHARDS)."; exit 1 ;;
          esac

  playwright-expo:
    name: Playwright (Expo Web)
    needs: playwright-expo-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'dev' }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: expo-blob-*
          merge-multiple: true
          path: e2e/blob-report
        continue-on-error: true

      - name: Merge shard reports
        working-directory: e2e
        run: npx playwright merge-reports --reporter json,html ./blob-report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/expo-results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: html-report
        continue-on-error: true

      - name: Upload Expo Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-expo-report
          path: |
            e2e/html-report/
            e2e/test-results/expo-results.json
          retention-days: 14

      - name: Report shard outcome
        env:
          SHARDS: ${{ needs.playwright-expo-shard.result }}
        run: |
          echo "shards=$SHARDS"
          case "$SHARDS" in
            success|skipped) echo "Expo suite passed (or was skipped)." ;;
            *) echo "::error title=Expo E2E failed::A Playwright (Expo Web) shard did not pass ($SHARDS)."; exit 1 ;;
          esac

  report-failures:
    name: Report Failures to Linear
    needs: [playwright, playwright-expo]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (needs.playwright.result == 'failure' || needs.playwright-expo.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Falls back to the repo's default branch when there is no `dev`: the
          # promotion topology in docs/standards/branching.md is opt-in, and a
          # missing ref fails actions/checkout hard.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (vars.E2E_BASE_BRANCH || github.event.repository.default_branch) }}
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Download Playwright results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: .
        continue-on-error: true

      - name: Download Playwright Expo results
        uses: actions/download-artifact@v4
        with:
          name: playwright-expo-report
          path: .
        continue-on-error: true

      - name: Create Linear tickets for failures
        working-directory: e2e
        run: npx tsx scripts/report-failures.ts
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
