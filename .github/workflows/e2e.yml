  #         api-level: 34
  #         arch: x86_64
  #         profile: pixel_6
  #         emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
  #         script: |
  #           EXPO_APK_URL="https://d1ahtucjixef4r.cloudfront.net/Exponent-2.32.13.apk"
  #           curl -fsSL "$EXPO_APK_URL" -o /tmp/expo-go.apk
