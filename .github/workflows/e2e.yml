  #           kill $EXPO_PID 2>/dev/null || true
  #
  #     - name: Upload Maestro results
  #       if: always()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: maestro-report
  #         path: e2e/maestro-results.xml
  #         retention-days: 14
  #
