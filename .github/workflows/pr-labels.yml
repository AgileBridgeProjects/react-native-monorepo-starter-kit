name: PR Labels

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label-size:
    name: Label PR Size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'XS'
          s_label: 'S'
          m_label: 'M'
          l_label: 'L'
          xl_label: 'XL'
          xs_max_size: 75
          s_max_size: 250
          m_max_size: 600
          l_max_size: 1200
          fail_if_xl: false
          files_to_ignore: |
            "package-lock.json"
            "**/__snapshots__/**"
            "**/*.lock"
            "**/*.snap"
            "apps/expo/openapi/**"
            "apps/web/openapi/**"

  label-paths:
    name: Label Changed Areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
