<p style="margin: 0 0 16px 0; font-size: 20px; font-weight: 700; color: #03132e;">Hi {{DisplayName}},</p>
<p style="margin: 0 0 24px 0; font-size: 16px; line-height: 1.6; color: #495057;">
  We received a request to reset your StarterKit password. Tap the button below to choose a new one.
</p>
<!-- CTA button (gradient with solid fallback) -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="vq-cta" style="margin: 0 0 24px 0;">
  <tr>
    <td align="center" style="border-radius: 999px; background-color: #0a3d91; background-image: linear-gradient(90deg, #0a3d91 0%, #3bd7f6 100%);">
      <a href="{{Link}}" style="display: inline-block; padding: 15px 40px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none; border-radius: 999px;">Reset your password</a>
    </td>
  </tr>
</table>
<p style="margin: 0 0 8px 0; font-size: 14px; line-height: 1.6; color: #868e96;">
  This link expires in {{TokenExpiryHours}} hours. If you did not request a password reset, you can safely ignore this email.
</p>
